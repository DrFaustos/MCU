; Конфигурация mypy для MCU Client.
;
; Стратегия постепенного ужесточения: строгий режим включается только для
; новых модулей, которые уже полностью типизированы (models, call_registry,
; call_manager, config, pjsip_adapter). Остальной код (sip_engine, ui) пока
; проверяется в мягком режиме и ужесточается по мере типизации.

[mypy]
python_version = 3.10
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
check_untyped_defs = True
no_implicit_optional = True
show_error_codes = True
pretty = True

; --- Строгий режим для новых, полностью типизированных модулей ---
[mypy-mcuclient.models]
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_return_any = True
no_implicit_reexport = True

[mypy-mcuclient.call_registry]
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_return_any = True

[mypy-mcuclient.call_manager]
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_return_any = True

[mypy-mcuclient.config]
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_return_any = True

[mypy-mcuclient.pjsip_adapter]
disallow_untyped_defs = True
disallow_incomplete_defs = True
