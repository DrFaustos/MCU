; Тестовый H.323-конфиг для Asterisk (chan_ooh323).
; Слушает 1720 на localhost, без gatekeeper, вызовы идут в контекст testbed.
[general]
port = 1720
bindaddr = 127.0.0.1
gatekeeper = DISABLE
faststart = no
h245tunneling = yes
context = testbed

; Пример H.323-эндпоинта (для исходящих из Asterisk при необходимости)
; [h323-peer]
; type = friend
; host = 127.0.0.1
; context = testbed
