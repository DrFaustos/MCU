; План набора тестового стенда.
; 600 — Echo (проверка двустороннего аудио)
; 1001/1002 — звонок между абонентами
[testbed]
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

exten => 1001,1,Dial(PJSIP/1001,20)
 same => n,Hangup()

exten => 1002,1,Dial(PJSIP/1002,20)
 same => n,Hangup()

; H.323 -> SIP: входящий из chan_ooh323 попадает сюда (context=testbed)
; и переводится на SIP-плечо (наш MCU слушает 127.0.0.1:15080).
exten => 700,1,NoOp(H323 incoming)
 same => n,Dial(PJSIP/1001,20)
 same => n,Hangup()

; МСУ как набираемый номер зала: терминал/softphone набирает 6001, Asterisk
; сам знает, куда доставить (контакт появляется из REGISTER МСУ). Именно этот
; путь проверяет verify_registration.py — без него «звонок на номер зала»
; в стенде был бы невозможен, и тест скатился бы в набор по IP.
exten => 6001,1,Dial(PJSIP/6001,30)
 same => n,Hangup()
