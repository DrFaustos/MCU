; Тестовые абоненты локального стенда MCU (порт 15080).
; Имена секций уникальны (endpoint/auth/aor/identify), ссылки заданы явно.
[transport-testbed]
type=transport
protocol=udp
bind=127.0.0.1:15080

[1001]
type=endpoint
context=testbed
disallow=all
allow=ulaw
allow=alaw
direct_media=no
auth=1001-auth
aors=1001-aor

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=test1001

[1001-aor]
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=0

[1001-identify]
type=identify
endpoint=1001
match=127.0.0.1

[1002]
type=endpoint
context=testbed
disallow=all
allow=ulaw
allow=alaw
direct_media=no
auth=1002-auth
aors=1002-aor

[1002-auth]
type=auth
auth_type=userpass
username=1002
password=test1002

[1002-aor]
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=0

[1002-identify]
type=identify
endpoint=1002
match=127.0.0.1
