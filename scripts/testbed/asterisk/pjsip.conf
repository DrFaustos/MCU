; Минимальный тестовый pjsip.conf для локального стенда MCU.
; Транспорт на 127.0.0.1:15080. Абоненты 1001/1002 с паролями,
; плюс "echo"-эндпоинт без аутентификации для автотеста sipp.
;
; ВАЖНО: у секций endpoint/auth/aor ОБЯЗАНЫ быть разные имена и явные ссылки
; auth=/aors=. Если назвать их одним именем (исторический вариант), Asterisk
; не свяжет их, REGISTER не найдёт AOR и ответит 403 Forbidden — ровно то и
; происходило в стенде (см. register_1001_*.log в корне репозитория).
[transport-udp]
type=transport
protocol=udp
bind=127.0.0.1:15080

; --- автотест: вызов на 600 без пароля (только localhost) ---
[echo-anon]
type=endpoint
context=testbed
disallow=all
allow=ulaw
allow=alaw
direct_media=no

[echo-anon-identify]
type=identify
endpoint=echo-anon
match=127.0.0.1/32

; --- абонент 1001 (именно его регистрирует MCU в e2e-проверке) ---
[1001]
type=endpoint
context=testbed
disallow=all
allow=ulaw
allow=alaw
direct_media=no
auth=1001-auth
aors=1001-aor

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=test1001

[1001-aor]
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=0

; --- абонент 1002 ---
[1002]
type=endpoint
context=testbed
disallow=all
allow=ulaw
allow=alaw
direct_media=no
auth=1002-auth
aors=1002-aor

[1002-auth]
type=auth
auth_type=userpass
username=1002
password=test1002

[1002-aor]
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=0
