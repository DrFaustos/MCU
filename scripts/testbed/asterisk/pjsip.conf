; Минимальный тестовый pjsip.conf для локального стенда MCU.
; Транспорт на 127.0.0.1:15080. Абоненты 1001/1002 с паролями,
; плюс "echo"-эндпоинт без аутентификации для автотеста sipp.
[transport-udp]
type=transport
protocol=udp
bind=127.0.0.1:15080

; --- автотест: вызов на 600 без пароля (только localhost) ---
[echo-anon]
type=endpoint
context=testbed
disallow=all
allow=ulaw
allow=alaw
direct_media=no

[echo-anon]
type=identify
endpoint=echo-anon
match=127.0.0.1/32

; --- абонент 1001 ---
[1001]
type=endpoint
context=testbed
disallow=all
allow=ulaw
allow=alaw
direct_media=no

[1001]
type=auth
auth_type=userpass
username=1001
password=test1001

[1001]
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=0

; --- абонент 1002 ---
[1002]
type=endpoint
context=testbed
disallow=all
allow=ulaw
allow=alaw
direct_media=no

[1002]
type=auth
auth_type=userpass
username=1002
password=test1002

[1002]
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=0
