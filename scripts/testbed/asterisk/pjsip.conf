; Минимальный тестовый pjsip.conf для локального стенда MCU.
; Транспорт на 127.0.0.1:15080. Абоненты 1001/1002/6001 с паролями, плюс
; "echo"-эндпоинт без аутентификации для автотеста sipp.
;
; ДВА правила именования, на которых стенд однажды молчал час:
; 1) Ссылки auth=/aors= на ЭНДПОИНТЕ надо писать ЯВНО. Без них REGISTER
;    доходит до аутентификации, но не находит AOR -> 403 Forbidden
;    (история: register_1001_*.log в корне репозитория).
; 2) AOR обязан носить ИМЯ SIP-ПОЛЬЗОВАТЕЛЯ (aor [1001], а не [1001]).
;    Для multi-user AOR Asterisk ищет AOR по user из REGISTER и, не найдя,
;    отвечает 403/404; "красивые" суффиксы -aor/-auth ломают регистрацию, хотя
;    вызовы на Dial(PJSIP/...) продолжают работать и маскируют баг.
;    Имена разных ТИПОВ могут совпадать (endpoint [1001] + aor [1001]) — это
;    штатная раскладка FreePBX: имена уникальны в рамках типа, путаницы нет.
[transport-udp]
type=transport
protocol=udp
bind=127.0.0.1:15080

; --- автотест: вызов на 600 без пароля (только localhost) ---
[echo-anon]
type=endpoint
context=testbed
disallow=all
allow=ulaw
allow=alaw
direct_media=no

[echo-anon-identify]
type=identify
endpoint=echo-anon
match=127.0.0.1/32

; --- абонент 1001 (именно его регистрирует MCU в e2e-проверке) ---
[1001]
type=endpoint
context=testbed
disallow=all
allow=ulaw
allow=alaw
direct_media=no
auth=1001-auth
aors=1001

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=test1001

[1001]
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=0

; --- абонент 1002 ---
[1002]
type=endpoint
context=testbed
disallow=all
allow=ulaw
allow=alaw
direct_media=no
auth=1002-auth
aors=1002

[1002-auth]
type=auth
auth_type=userpass
username=1002
password=test1002

[1002]
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=0

; --- МСУ как набираемый номер зала 6001 -------------------------------
; Отдельный абонент, а не 1001: 1001/1002 заняты sipp-сценариями, и если
; MCU зарегистрируется под 1001, тест «позвонить на МСУ через АТС» начал бы
; звонить сам себе. Пароль совпадает с config.example.json (секция
; sip.registration), чтобы стенд поднимался одной командой.
; max_contacts=1: у МСУ один Contact, а remove_existing=yes чинит «зависший»
; контакт после предыдущего запуска стенда.
[6001]
type=endpoint
context=testbed
disallow=all
allow=ulaw
allow=alaw
direct_media=no
auth=6001-auth
aors=6001

[6001-auth]
type=auth
auth_type=userpass
username=6001
password=test6001

[6001]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=0
