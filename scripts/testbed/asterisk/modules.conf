; Тестовый стенд: autoload=yes — как в штатном Asterisk.
; Отключаем только заведомо лишнее для локального стенда.
[modules]
autoload=yes

; Не грузим тяжёлые/ненужные подсистемы.
noload => chan_sip.so
noload => chan_alsa.so
noload => chan_oss.so
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so
