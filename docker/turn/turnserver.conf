# Конфигурация coturn для MCU (WebRTC через интернет/NAT).
#
# Подставьте внешний IP/домен и надёжные секреты через переменные окружения
# (TURN_EXTERNAL_IP, TURN_USER, TURN_PASSWORD) — см. docker-compose.yml.
#
# Порт 3478 — STUN/TURN (UDP/TCP), 5349 — TURN-over-TLS, диапазон 49160-49200 —
# ретрансляция медиа. Откройте их на файрволе/в security group.

listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
use-auth-secret
realm=mcu.local
server-name=mcu.local

# Внешний адрес, который увидят клиенты (обязателен за NAT).
external-ip=${TURN_EXTERNAL_IP}

# Учётка для simple-режима (use-auth-secret + user = долгоживущий вариант).
user=${TURN_USER}:${TURN_PASSWORD}

# Диапазон портов ретрансляции (UDP).
min-port=49160
max-port=49200

# Логи и производительность.
log-file=stdout
no-cli
no-multicast-peers
no-loopback-peers

# Отключаем лишние методы аутентификации (только long-term credential).
no-tlsv1
no-tlsv1_1

# Сертификаты для TLS (опционально; если включите 5349 — смонтируйте их).
# cert=/etc/coturn/fullchain.pem
# pkey=/etc/coturn/privkey.pem
