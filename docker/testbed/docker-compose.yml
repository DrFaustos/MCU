# Стенд «Asterisk + MCU + sipp» целиком в контейнерах — без хостовых
# установок asterisk/sipp/pjsua2.
#
# Цель- верхнего уровня:
#   podman compose up --abort-on-container-exit sipp-polycom
# = реалистичный Polycom-звонок (вендорский порядок PT, H.264 High первым)
# через Asterisk в номер зала 6001, где сидит MCU.
#
# Сервисы:
#   asterisk    — минимальный образ из docker/testbed/asterisk.Dockerfile,
#                 конфиги берутся из scripts/testbed/asterisk (источник
#                 правды — репозиторий, а не образ);
#   mcu         — образ mcu-dev (docker/mcu-dev.Dockerfile; собирается
#                 ПОВЕРХ mcu-dev-base, см. README каталога — base не
#                 пересобираем лишний раз); исходники монтируются томом;
#   sipp-*      — профили прогонов: image docker.io/sipp/sipp, том со
#                 сценариями scripts/testbed/sipp, entrypoint переопределён.
#
# Совместимость: файл писался под `podman compose` (podman-compose) и
# docker-compose v2. Флаги вроде --abort-on-container-exit принимает
# `podman compose up`; docker-compose их не знает — см. README.

name: mcu-testbed

# Подсеть стенда по умолчанию 10.101.0.0/24. Если она (или её /8-родитель,
# напр. корпоративный VPN 10.0.0.0/8) уже занята на хосте, netavark откажет:
# «subnet is already used». Задайте подсеть, IP сценариев и ПЕРЕСОБЕРИТЕ
# asterisk согласованно (identify запечён в образ), напр.:
#   export MCU_TESTBED_SUBNET=10.222.8.0/24 MCU_TESTBED_SIPP_IP=10.222.8.30
#   podman build --build-arg TESTBED_SIPP_IP=$MCU_TESTBED_SIPP_IP \
#     -f docker/testbed/asterisk.Dockerfile -t localhost/mcu-testbed-asterisk:latest .

networks:
  testbed:
    ipam:
      config:
        # Подсеть обязана совпадать с тем, что передан в asterisk.Dockerfile
        # (ARG TESTBED_SIPP_IP — identify-правило стенда сужено к IP
        # сценариев внутри этой подсети, а не к 127.0.0.1/32).
        - subnet: ${MCU_TESTBED_SUBNET:-10.101.0.0/24}

services:
  asterisk:
    build:
      context: ../..
      dockerfile: docker/testbed/asterisk.Dockerfile
    image: localhost/mcu-testbed-asterisk:latest
    networks: [testbed]
    healthcheck:
      # Тот же критерий готовности, что у bash-стенда: дождались транспорт
      # 15080 в pjsip, а не «asterisk -rx вообще отвечает».
      test: ["CMD-SHELL", "asterisk -rx 'pjsip show transports' 2>/dev/null | grep -q 15080"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 6
    restart: "no"

  mcu:
    # Требуется localhost/mcu-dev:latest (или podman build -t mcu-dev
    # -f docker/mcu-dev.Dockerfile .; base mcu-dev-base — отдельным шагом,
    # он меняется редко). Секцию build оставляю закомментированной
    # намеренно: пересобирать mcu-dev при каждом compose — значит дёргать
    # pip-слой, а код всё равно приходит томом.
    # build:
    #   context: ../..
    #   dockerfile: docker/mcu-dev.Dockerfile
    image: localhost/mcu-dev:latest
    volumes:
      - ../..:/src:ro,z
    working_dir: /src
    command:
      - python3
      - run.py
      - --headless
      - --config
      - /src/docker/testbed/mcu.config.json
      - --null-audio
      - --display-name
      - MCU Testbed
    networks: [testbed]
    depends_on:
      asterisk:
        condition: service_healthy
    restart: "no"

  # Реалистичный Polycom: INVITE на 6001 (номер зала) с вендорским порядком
  # PT; MCU должен согласовать G.711 (G.722 у зала может не быть) и H.264,
  # а вызов дожить до BYE.
  sipp-polycom:
    image: docker.io/sipp/sipp
    entrypoint: ["sipp"]
    command:
      - -sf
      - /scenarios/uac_polycom_video.xml
      - asterisk:15080
      - -p
      - "15090"
      - -m
      - "1"
      - -r
      - "1"
      - -l
      - "1"
      - -timeout
      - 60s
      - -nostdin
    volumes:
      - ../../scripts/testbed/sipp:/scenarios:ro,z
    networks:
      testbed:
        # Статический IP обязателен: identify echo-anon в образе asterisk
        # сужен до адреса сценариев (ARG TESTBED_SIPP_IP), а не до подсети —
        # иначе анонимный catch-all перехватывал бы REGISTER зала (живой e2e
        # показал 403 «no configured AORs»). Меняйте вместе с подсетью и
        # пересобирайте asterisk с тем же TESTBED_SIPP_IP.
        ipv4_address: ${MCU_TESTBED_SIPP_IP:-10.101.0.30}
    depends_on:
      asterisk:
        condition: service_healthy
      mcu:
        condition: service_started
    restart: "no"

  # Sony с приоритетом G.722/G.722.1/G.719 на echo-номер 600: работает БЕЗ
  # mcu (проверяет, что согласование честно откатывается на G.711):
  #   podman compose up --abort-on-container-exit sipp-sony
  sipp-sony:
    image: docker.io/sipp/sipp
    entrypoint: ["sipp"]
    command:
      - -sf
      - /scenarios/uac_sony_audio.xml
      - asterisk:15080
      - -p
      - "15091"
      - -m
      - "1"
      - -r
      - "1"
      - -l
      - "1"
      - -timeout
      - 60s
      - -nostdin
    volumes:
      - ../../scripts/testbed/sipp:/scenarios:ro,z
    networks:
      testbed:
        # Статический IP обязателен: identify echo-anon в образе asterisk
        # сужен до адреса сценариев (ARG TESTBED_SIPP_IP), а не до подсети —
        # иначе анонимный catch-all перехватывал бы REGISTER зала (живой e2e
        # показал 403 «no configured AORs»). Меняйте вместе с подсетью и
        # пересобирайте asterisk с тем же TESTBED_SIPP_IP.
        ipv4_address: ${MCU_TESTBED_SIPP_IP:-10.101.0.30}
    depends_on:
      asterisk:
        condition: service_healthy
    restart: "no"

  # Session timers (Require: timer, Session-Expires: 180) + opportunistic
  # PRACK + REFRESH методом UPDATE. Прогон ~95 с (Min-SE=90 по RFC 4028).
  sipp-100rel:
    image: docker.io/sipp/sipp
    entrypoint: ["sipp"]
    command:
      - -sf
      - /scenarios/uac_100rel_timers.xml
      - asterisk:15080
      - -p
      - "15092"
      - -m
      - "1"
      - -r
      - "1"
      - -l
      - "1"
      - -timeout
      - 180s
      - -nostdin
    volumes:
      - ../../scripts/testbed/sipp:/scenarios:ro,z
    networks:
      testbed:
        # Статический IP обязателен: identify echo-anon в образе asterisk
        # сужен до адреса сценариев (ARG TESTBED_SIPP_IP), а не до подсети —
        # иначе анонимный catch-all перехватывал бы REGISTER зала (живой e2e
        # показал 403 «no configured AORs»). Меняйте вместе с подсетью и
        # пересобирайте asterisk с тем же TESTBED_SIPP_IP.
        ipv4_address: ${MCU_TESTBED_SIPP_IP:-10.101.0.30}
    depends_on:
      asterisk:
        condition: service_healthy
      mcu:
        condition: service_started
    restart: "no"
