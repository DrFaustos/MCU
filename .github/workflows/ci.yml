name: CI

# Ветка linux-dev: быстрый цикл (lint + тесты), БЕЗ ожидания сборки
# Windows/AppImage. Полный кроссплатформенный CI — только на main/PR в main.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # pjsua2 НЕ ставим: тесты работают в режиме-заглушке.
          # Тяжёлые GUI/медиа-зависимости (PySide6, opencv, mss) не нужны
          # для модульных тестов config/sip_engine.
          pip install pytest pytest-cov ruff

      - name: Ruff (lint) — блокирует только явные ошибки
        run: ruff check . --select E,F,W --ignore E501 || true

      - name: Pytest
        run: python -m pytest tests/ -v --cov=mcuclient --cov-report=term-missing
        continue-on-error: false

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          pip install mypy
      - name: Mypy — строгие модули (блокирует)
        # Эти модули уже полностью типизированы; регресс недопустим.
        run: |
          mypy mcuclient/models.py mcuclient/call_registry.py \
               mcuclient/call_manager.py mcuclient/pjsip_adapter.py \
               mcuclient/config.py mcuclient/qt_platform.py
      - name: Mypy — остальной пакет (не блокирует, пока идёт типизация)
        run: mypy mcuclient --ignore-missing-imports || true

  # Быстрая проверка, что dev-скрипты синтаксически валидны и контейнерные
  # определения на месте — без реальной сборки образов (она долгая и локальная).
  dev-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck dev scripts (syntax)
        run: |
          for f in scripts/dev/*.sh scripts/testbed/*.sh; do
            bash -n "$f" && echo "OK  $f" || { echo "FAIL $f"; exit 1; }
          done

      - name: Dockerfiles present
        run: |
          test -f docker/mcu-dev-base.Dockerfile || { echo "нет базового Dockerfile"; exit 1; }
          test -f docker/mcu-dev.Dockerfile || { echo "нет рабочего Dockerfile"; exit 1; }
          echo "OK"

      - name: Python syntax check (entrypoints + new modules)
        run: |
          python -m py_compile run.py mcuclient/qt_platform.py mcuclient/doctor.py \
              mcuclient/rtcp_metrics.py mcuclient/icons.py \
              scripts/testbed/two_instance_video_call.py
          echo "OK"

      - name: Testbed configs consistency (H.323 route, video stand)
        run: |
          test -f scripts/testbed/run_two_instance_video_test.sh || { echo "нет видео-стенда"; exit 1; }
          test -f scripts/testbed/two_instance_video_call.py || { echo "нет видео-раннера"; exit 1; }
          grep -q "exten => 700" scripts/testbed/asterisk/extensions.conf || { echo "нет маршрута 700 (H.323->SIP)"; exit 1; }
          echo "OK"
