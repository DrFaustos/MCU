name: CI

# Ветка linux-dev: быстрый цикл (lint + тесты), БЕЗ ожидания сборки
# Windows/AppImage. Полный кроссплатформенный CI — только на main/PR в main.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # pjsua2 НЕ ставим: тесты работают в режиме-заглушке.
          # Тяжёлые GUI/медиа-зависимости (PySide6, opencv, mss) не нужны
          # для модульных тестов config/sip_engine.
          pip install pytest pytest-cov "ruff==0.16.*"

      - name: Ruff (стиль) — БЛОКИРУЕТ
        # Накопленный шум (14 F401, 8 E702, 3 E402, 2 W293) разобран
        # 2026-10-08: шаг даёт 0 нарушений, поэтому `|| true` убран — с ним
        # проверки не было вовсе (ровно так пережили потерянный closeEvent).
        # Версия ruff зафиксирована: новый релиз линтера приносит новые
        # правила и покраснил бы блокирующий шаг в коде, которого не касались.
        # Обновлять осознанно: raise -> прогон ruff локально -> коммит.
        run: ruff check . --select E,F,W --ignore E501

      - name: Ruff (ошибки кода) — БЛОКИРУЕТ
        # F821 (неопределённое имя) когда-то молча жил в mcuclient/ui.py: в
        # closeEvent потерялся заголовок метода, и его тело уехало в
        # _update_web_label — GUI гасил движок при обновлении подписи панели и
        # падал на NameError. PySide6 в CI не стоит, pytest это не проверяет,
        # а предыдущий шаг с `|| true` такой ошибки не видел вовсе.
        # F811 — перезаопределение, F841 — присвоено и не использовано,
        # E9 — синтаксические ошибки.
        run: ruff check . --select F821,F811,F841,E9

      - name: Pytest
        run: python -m pytest tests/ -v --cov=mcuclient --cov-report=term-missing
        continue-on-error: false

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mypy
        # Версия зафиксирована: шаг ниже стал блокирующим, а вывод mypy
        # меняется от релиза к релизу (новые проверки — новые ошибки в коде,
        # который мы не трогали). Обновлять осознанно, вместе с правками.
        run: |
          python -m pip install --upgrade pip
          pip install "mypy==2.4.*"
      - name: Mypy — строгие модули (блокирует)
        # Эти модули уже полностью типизированы; регресс недопустим.
        run: |
          mypy mcuclient/models.py mcuclient/call_registry.py \
               mcuclient/call_manager.py mcuclient/pjsip_adapter.py \
               mcuclient/config.py mcuclient/qt_platform.py
      - name: Mypy — весь пакет (БЛОКИРУЕТ)
        # Типизация пакета закончена 2026-10-08: mypy mcuclient даёт 0 ошибок
        # (было 92). Шаг с `|| true` проверку не делал — именно так в своё время
        # пережили и потерянный заголовок closeEvent, и config.audio_codecs(),
        # вызванный как метод у property: линтер видел дефект, `|| true` его глотал.
        # Регресс теперь недопустим: новая ошибка типов не должна попадать в main.
        run: mypy mcuclient --ignore-missing-imports

  # Быстрая проверка, что dev-скрипты синтаксически валидны и контейнерные
  # определения на месте — без реальной сборки образов (она долгая и локальная).
  dev-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check (все .sh из репозитория)
        # Покрытие берётся из git ls-files, а не из перечня: перечнем оно
        # отстаёт молча — новому файлу неоткуда узнать, что его надо
        # добавить. Страж: tests/test_ci_shell_coverage.py.
        run: |
          count=0
          while IFS= read -r -d "" f; do
            bash -n "$f" && echo "OK  $f" || { echo "FAIL $f"; exit 1; }
            count=$((count + 1))
          done < <(git ls-files -z "*.sh")
          if [ "$count" -eq 0 ]; then
            echo "git ls-files не вернул ни одного .sh — покрытие не работает"
            exit 1
          fi
          echo "проверено shell-скриптов: $count"

      - name: Testbed wrapper guards (stand.sh contract)
        # каждая обёртка two_instance обязана проверять pjsua2 ДО
        # прогона, держать замок, не считать успехом [skip] и требовать
        # маркер успеха в логе. Без этого шага обёртка без pjsua2
        # рапортовала зелёным (см. scripts/testbed/lib/stand.sh).
        run: |
          fail=0
          for f in scripts/testbed/run_two_instance_*.sh; do
            grep -q "lib/stand.sh" "$f" || { echo "FAIL $f: нет . lib/stand.sh"; fail=1; }
            grep -q "stand_require_pjsua2" "$f" || { echo "FAIL $f: нет stand_require_pjsua2"; fail=1; }
            grep -q "stand_gate" "$f" || { echo "FAIL $f: нет stand_gate"; fail=1; }
            grep -q "stand_skip_seen" "$f" || { echo "FAIL $f: нет stand_skip_seen"; fail=1; }
            grep -q "stand_report_skip" "$f" || { echo "FAIL $f: нет stand_report_skip"; fail=1; }
            grep -Eq "grep -q .*[.]log" "$f" || { echo "FAIL $f: нет маркера успеха в логе"; fail=1; }
          done
          if [ "$fail" != 0 ]; then
            echo "обёртки стендов не соответствуют контракту scripts/testbed/lib/stand.sh"
            exit 1
          fi
          echo "OK: обёртки стендов соответствуют контракту stand.sh"

      - name: Dockerfiles present
        run: |
          test -f docker/mcu-dev-base.Dockerfile || { echo "нет базового Dockerfile"; exit 1; }
          test -f docker/mcu-dev.Dockerfile || { echo "нет рабочего Dockerfile"; exit 1; }
          echo "OK"

      - name: Python syntax check (entrypoints + new modules)
        run: |
          python -m py_compile run.py mcuclient/qt_platform.py mcuclient/doctor.py \
              mcuclient/rtcp_metrics.py mcuclient/icons.py \
              mcuclient/x11_embed.py \
              scripts/testbed/two_instance_video_call.py \
              scripts/testbed/two_instance_chat.py
          echo "OK"

      - name: Testbed configs consistency (H.323 route, video + chat stands)
        run: |
          test -f scripts/testbed/run_two_instance_video_test.sh || { echo "нет видео-стенда"; exit 1; }
          test -f scripts/testbed/two_instance_video_call.py || { echo "нет видео-раннера"; exit 1; }
          test -f scripts/testbed/run_two_instance_chat_test.sh || { echo "нет чат-стенда"; exit 1; }
          test -f scripts/testbed/two_instance_chat.py || { echo "нет чат-раннера"; exit 1; }
          grep -q "exten => 700" scripts/testbed/asterisk/extensions.conf || { echo "нет маршрута 700 (H.323->SIP)"; exit 1; }
          echo "OK"

      - name: C++ host sources present (mcu_h323d, ADR-0002)
        run: |
          test -f tools/h323d/CMakeLists.txt || { echo "нет CMakeLists.txt хоста"; exit 1; }
          test -f tools/h323d/main.cpp || { echo "нет main.cpp хоста"; exit 1; }
          test -f tools/h323d/ipc.hpp || { echo "нет ipc.hpp хоста"; exit 1; }
          grep -q "set_on_client_connected" tools/h323d/ipc.hpp || { echo "нет хука ready при подключении"; exit 1; }
          echo "OK"
