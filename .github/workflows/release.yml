name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_linux:
        description: 'Собирать Linux-бинарник (PJSIP из исходников) — долго'
        type: boolean
        default: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install pjsua2-wheel

      # pjsua2 обязателен: без него SIP-транспорт в .exe не поднимется.
      - name: Verify pjsua2 (required for SIP)
        run: python -c "import pjsua2; print('pjsua2 OK:', pjsua2.__file__)"

      - name: Build executable
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: python build.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MCU-Client-Windows
          path: |
            dist/MCU-Client.exe

  # Linux-бинарник: собирается по тегу, а также вручную (workflow_dispatch).
  build-linux:
    if: ${{ github.event_name == 'push' || inputs.build_linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Qt xcb (X11) требует libxcb-cursor0 (с Qt 6.5) — нужен для
          # корректного позиционирования курсора на Wayland-сессиях.
          sudo apt-get install -y ffmpeg libxcb-cursor0 libxcb-xinerama0             libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1             libxcb-randr0 libxcb-render-util0 libxcb-shape0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # SWIG-сборка PJSIP: видит реальные аудиоустройства (в pybind11-wheel
      # их нет). Крэш при входящем вызове устранён установкой
      # CallOpParam.statusCode=200 в answer().
      - name: Install PJSIP (pjsua2, static)
        env:
          PJSIP_STATIC: '1'
          PJSIP_VERSION: '2.16'
        run: |
          chmod +x scripts/install_pjsua2.sh
          sudo -E ./scripts/install_pjsua2.sh "$(which python)"
          python -c "import pjsua2; print('pjsua2 OK:', pjsua2.__file__)"

      - name: Build executable
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: python build.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MCU-Client-Linux
          path: |
            dist/MCU-Client

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MCU-Client-Windows
          path: release-files/

      - uses: actions/download-artifact@v4
        with:
          name: MCU-Client-Linux
          path: release-files/

      - name: List release files
        run: ls -la release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          # Проект в активной разработке (pre-alpha): все релизы помечаются
          # как предварительные. Убрать строку, когда появится стабильный релиз.
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
