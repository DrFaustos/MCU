name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_linux:
        description: 'Собирать Linux (PJSIP из исходников + AppImage) — долго'
        type: boolean
        default: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install pjsua2-wheel

      # pjsua2 обязателен: без него SIP-транспорт в .exe не поднимется.
      - name: Verify pjsua2 (required for SIP)
        run: python -c "import pjsua2; print('pjsua2 OK:', pjsua2.__file__)"

      - name: Build executable (+ debug console build)
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: python build.py --console

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MCU-Client-Windows
          path: |
            dist/MCU-Client.exe
            dist/MCU-Client-console.exe

  # Linux/AppImage собирается ТОЛЬКО по ручному запуску (workflow_dispatch)
  # с включённой галочкой build_linux. Это сильно ускоряет обычную сборку
  # по тегу, пока идёт отладка Windows. Вернуть в тег можно в любой момент,
  # убрав условие `if` ниже.
  build-linux:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fuse libfuse2 file desktop-file-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Ставим pjsua2 статически, чтобы SIP-стек попал в AppImage
      # и не зависел от системных libpjsua2*.so на машине пользователя.
      - name: Install PJSIP (pjsua2, static)
        env:
          PJSIP_STATIC: '1'
          PJSIP_VERSION: '2.16'
        run: |
          chmod +x scripts/install_pjsua2.sh
          sudo -E ./scripts/install_pjsua2.sh "$(which python)"
          python -c "import pjsua2; print('pjsua2 OK:', pjsua2.__file__)"

      - name: Build executable + AppImage
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: python build.py --appimage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MCU-Client-Linux
          path: |
            dist/MCU-Client
            dist/MCU-Client-x86_64.AppImage

  release:
    # Зависим только от Windows: Linux теперь опционален.
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MCU-Client-Windows
          path: release-files/

      - name: Download Linux artifacts (optional)
        uses: actions/download-artifact@v4
        with:
          name: MCU-Client-Linux
          path: release-files/
        continue-on-error: true

      - name: List release files
        run: ls -la release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # Звёздочка берёт все файлы, которые реально скачались:
          # Windows всегда, Linux/AppImage — только если собирались.
          files: release-files/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
