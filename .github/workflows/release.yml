name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_linux:
        description: 'Собирать Linux-бинарник (PJSIP из исходников) — долго'
        type: boolean
        default: true
      variant:
        description: 'Вариант протокола для имени артефактов (ручной запуск)'
        type: choice
        default: 'h323'
        options: ['h323', 'sip', 'none']

jobs:
  # Вариант протокола — факт ИСХОДНИКОВ (mcuclient.PROTOCOL_VARIANT), а не
  # имя тега: суффикс тега обязан ему равняться. Без этой сверки тег
  # v0.2.34-sip, поставленный на h323-коммит, собрал бы «sip»-бинарь с
  # h323-кодом внутри, и имя артефакта только соврало бы красивее.
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      variant: ${{ steps.v.outputs.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tag suffix must equal PROTOCOL_VARIANT
        id: v
        env:
          DISPATCH_VARIANT: ${{ inputs.variant || 'none' }}
        run: |
          SRC=$(python -c "import sys; sys.path.insert(0,'.'); import mcuclient; print(mcuclient.PROTOCOL_VARIANT)")
          VER=$(python -c "import sys; sys.path.insert(0,'.'); import mcuclient; print(mcuclient.__version__)")
          if [ "${GITHUB_REF_NAME#refs/tags/v}" != "$GITHUB_REF_NAME" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" = "$VER" ] || [ "${TAG#*-}" = "$TAG" ]; then
              echo "::error::тег '$GITHUB_REF_NAME' без суффикса варианта: ждём v$VER-h323 / v$VER-sip"
              exit 1
            fi
            SUFFIX="${TAG#*-}"
          else
            SUFFIX="$DISPATCH_VARIANT"
            [ "$SUFFIX" = "none" ] && SUFFIX="$SRC"
          fi
          if [ "$SUFFIX" != "$SRC" ]; then
            echo "::error::тег зовёт вариант '$SUFFIX', а исходники этой ветки — '$SRC'. Тег поставлен не на ту ветку."
            exit 1
          fi
          echo "variant=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "OK: тег/запуск = $SUFFIX, исходники = $SRC, версия = $VER"

      - name: Prune old releases of this line (keep 3 latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VAR="${{ steps.v.outputs.variant }}"
          # линия = релизы с суффиксом варианта + (только для sip) легаси-теги
          # без суффикса: до введения вариантов это была sip-нумерация.
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -r --arg var "$VAR" 'if type == "array" then .[] | select((.tag_name | endswith("-" + $var)) or ($var == "sip" and (.tag_name | test("^v[0-9.]+$")))) | "\(.created_at) \(.id) \(.tag_name)" else empty end' \
            | sort -r | tail -n +4 | while read -r _ ID TAG; do
              echo "prune: release $ID ($TAG)"
              gh release delete "$ID" --yes --cleanup-tag=false || true; done


  build-windows:
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install pjsua2-wheel

      # pjsua2 обязателен: без него SIP-транспорт в .exe не поднимется.
      - name: Verify pjsua2 (required for SIP)
        run: python -c "import pjsua2; print('pjsua2 OK:', pjsua2.__file__)"

      # Релиз собирает ТОЛЬКО debug-бинарник (консольный, MCU_DEBUG=1):
      # расширенный лог запуска/работы. Релизная (windowed) сборка на этом
      # этапе не нужна — приложение в активной отладке.
      - name: Build executable (debug only)
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: python build.py --debug-only

      # Имя бинаря несёт вариант: в загрузках/архивах экзешник виден без
      # описания артефакта, а внутренний ресурс .exe — только на Windows.
      - name: Name binary after variant
        shell: bash
        run: mv dist/MCU-debug.exe "dist/MCU-${{ needs.preflight.outputs.variant }}-debug.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MCU-Windows-${{ needs.preflight.outputs.variant }}
          path: dist/MCU-${{ needs.preflight.outputs.variant }}-debug.exe

  # Linux-бинарник: собирается по тегу, а также вручную (workflow_dispatch).
  build-linux:
    needs: preflight
    if: ${{ github.event_name == 'push' || inputs.build_linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Qt xcb (X11) требует libxcb-cursor0 (с Qt 6.5) — нужен для
          # корректного позиционирования курсора на Wayland-сессиях.
          sudo apt-get install -y ffmpeg libxcb-cursor0 libxcb-xinerama0             libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1             libxcb-randr0 libxcb-render-util0 libxcb-shape0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # SWIG-сборка PJSIP: видит реальные аудиоустройства (в pybind11-wheel
      # их нет). Крэш при входящем вызове устранён установкой
      # CallOpParam.statusCode=200 в answer().
      - name: Install PJSIP (pjsua2, static)
        env:
          PJSIP_STATIC: '1'
          PJSIP_VERSION: '2.16'
        run: |
          chmod +x scripts/install_pjsua2.sh
          sudo -E ./scripts/install_pjsua2.sh "$(which python)"
          python -c "import pjsua2; print('pjsua2 OK:', pjsua2.__file__)"

      # Только debug-бинарник (консольный, MCU_DEBUG=1) — расширенный лог.
      - name: Build executable (debug only)
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: python build.py --debug-only

      - name: Name binary after variant
        run: mv dist/MCU-debug "dist/MCU-${{ needs.preflight.outputs.variant }}-debug"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MCU-Linux-${{ needs.preflight.outputs.variant }}
          path: dist/MCU-${{ needs.preflight.outputs.variant }}-debug

  release:
    if: ${{ github.event_name == 'push' }}
    needs: [preflight, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MCU-Windows-${{ needs.preflight.outputs.variant }}
          path: release-files/

      - uses: actions/download-artifact@v4
        with:
          name: MCU-Linux-${{ needs.preflight.outputs.variant }}
          path: release-files/

      - name: List release files
        run: ls -la release-files/

      # Линия варианта разрастается ассетами по 300–750 МБ на релиз.
      # Чистим релизы старейшие-вниз, оставляя 3 свежих; git-теги не трогаем
      # (--cleanup-tag=false). Сортировка по created_at, не по имени:
      # лексикографический порядок врёт на легаси-номерах 0.2.9 vs 0.2.10.
      # $VAR передаётся в jq через --arg: внутри jq-программы в двойных
      # кавычках «$VAR == "sip"» раскрывался бы в голый h323/sip до вызова jq —
      # compile error, молча маскируемый конвейером (проверено локально).
      # Если релиз по этому тегу уже существует (напр. тег переставлен),
      # удаляем его — иначе softprops/action-gh-release падает с
      # "already_exists: tag_name" на финализации.
      - name: Delete existing release for tag (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag=false || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          # Проект в активной разработке (pre-alpha): все релизы помечаются
          # как предварительные. Убрать строку, когда появится стабильный релиз.
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}