name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build executable
        run: python build.py
      
      - name: Download FFmpeg for Windows
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp"
          Move-Item -Path "ffmpeg_temp\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe" -Destination "dist\ffmpeg.exe"
          Remove-Item -Recurse -Force "ffmpeg_temp", "ffmpeg.zip"
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MCU-Client-Windows
          path: |
            dist/MCU-Client.exe
            dist/ffmpeg.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build executable
        run: python build.py
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MCU-Client-Linux
          path: dist/MCU-Client

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MCU-Client-Windows
          path: release-files/
      
      - uses: actions/download-artifact@v4
        with:
          name: MCU-Client-Linux
          path: release-files/
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/MCU-Client.exe
            release-files/ffmpeg.exe
            release-files/MCU-Client
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}