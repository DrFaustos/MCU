name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # pjsua2 (SWIG-биндинг PJSIP) не имеет официального wheel для Windows.
      # Без него SIP-транспорт в собранном .exe не поднимется.
      - name: Check pjsua2 availability
        run: |
          python -c "import pjsua2; print('pjsua2 OK')" || echo "::warning::pjsua2 не установлен — SIP в .exe будет в режиме-заглушке. См. README (установка pjsua2 на Windows)."

      - name: Build executable
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: python build.py --allow-no-pjsip

      - name: Download FFmpeg for Windows
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp"
          Move-Item -Path "ffmpeg_temp\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe" -Destination "dist\ffmpeg.exe"
          Remove-Item -Recurse -Force "ffmpeg_temp", "ffmpeg.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MCU-Client-Windows
          path: |
            dist/MCU-Client.exe
            dist/ffmpeg.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fuse libfuse2 file desktop-file-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Ставим pjsua2 статически, чтобы SIP-стек попал в AppImage
      # и не зависел от системных libpjsua2*.so на машине пользователя.
      - name: Install PJSIP (pjsua2, static)
        env:
          PJSIP_STATIC: '1'
          PJSIP_VERSION: '2.16'
        run: |
          chmod +x scripts/install_pjsua2.sh
          sudo -E ./scripts/install_pjsua2.sh "$(which python)"
          python -c "import pjsua2; print('pjsua2 OK:', pjsua2.__file__)"

      - name: Build executable + AppImage
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: python build.py --appimage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MCU-Client-Linux
          path: |
            dist/MCU-Client
            dist/MCU-Client-x86_64.AppImage

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MCU-Client-Windows
          path: release-files/

      - uses: actions/download-artifact@v4
        with:
          name: MCU-Client-Linux
          path: release-files/

      - name: List release files
        run: ls -la release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/MCU-Client.exe
            release-files/ffmpeg.exe
            release-files/MCU-Client
            release-files/MCU-Client-x86_64.AppImage
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
