[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcuclient"
version = "0.1.0"
description = "Кроссплатформенный ВКС-клиент (SIP/H.323) уровня MCU: приём и исходящие вызовы, аудио+видео, управление битрейтом"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MCU Client" }]
dependencies = [
    "PySide6>=6.6,<7",
    "psutil>=5.9",
]

[project.optional-dependencies]
# pjsua2 ставится отдельно (см. README). Здесь только для сред, где доступен пакет.
sip = ["pjsua2>=2.14"]

[project.scripts]
mcuclient = "run:main"

[tool.setuptools]
packages = ["mcuclient"]

[tool.pytest.ini_options]
testpaths = ["tests"]
