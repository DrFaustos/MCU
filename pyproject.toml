[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcuclient"
version = "0.2.13"
description = "Кроссплатформенный ВКС-клиент (SIP/H.323) уровня MCU: приём и исходящие вызовы, аудио+видео, управление битрейтом"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MCU Client" }]
dependencies = [
    "PySide6>=6.6,<7",
    "psutil>=5.9",
]

[project.optional-dependencies]
# pjsua2 ставится отдельно (см. README). Здесь только для сред, где доступен пакет.
sip = ["pjsua2>=2.14"]
# Зависимости для разработки/CI (тесты, линт, типы).
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5", "mypy>=1.8"]

[project.scripts]
mcuclient = "run:main"

[tool.setuptools]
packages = ["mcuclient"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # длину строк контролирует line-length
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

# --- mypy: постепенный строгий режим -----------------------------------------
# Базовые настройки: не блокируют, пока идёт типизация легаси-кода.
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

# Строгие проверки для уже вычищенных модулей.
[[tool.mypy.overrides]]
module = [
    "mcuclient.models",
    "mcuclient.call_registry",
    "mcuclient.call_manager",
    "mcuclient.pjsip_adapter",
    "mcuclient.config",
    "mcuclient.adaptive_bitrate",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
no_implicit_reexport = false  # модели реэкспортируются намеренно
